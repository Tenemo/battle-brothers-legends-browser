name: production e2e

on:
  push:
    branches: [development, master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCTION_WEB_BASE_URL: https://battlebrothers.academy

concurrency:
  group: production-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-production-deploy:
    name: wait for production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1

      - name: wait for stable production readiness
        run: |
          production_readiness_args=(
            --web "$PRODUCTION_WEB_BASE_URL"
            --timeout-ms 1800000
            --interval-ms 15000
            --request-timeout-ms 10000
            --required-stable-checks 2
          )

          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
            production_readiness_args=(--commit ${{ github.sha }} "${production_readiness_args[@]}")
          else
            echo "Branch ${{ github.ref_name }} production e2e targets the live site without requiring branch commit ${{ github.sha }} to be deployed."
            echo "Browser tests will run from ${{ github.ref_name }} against $PRODUCTION_WEB_BASE_URL."
          fi

          node scripts/wait-for-production-deploy.ts "${production_readiness_args[@]}"

  production-e2e-browser:
    name: production e2e browser
    needs: [wait-for-production-deploy]
    if: >-
      ${{
        always() &&
        needs.wait-for-production-deploy.result == 'success'
      }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    timeout-minutes: 45

    env:
      CI: true
      HOME: /root
      PLAYWRIGHT_BASE_URL: ${{ env.PRODUCTION_WEB_BASE_URL }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: verify production readiness from browser runner
        run: |
          production_readiness_args=(
            --web "$PLAYWRIGHT_BASE_URL"
            --timeout-ms 1800000
            --interval-ms 15000
            --request-timeout-ms 10000
            --required-stable-checks 2
          )

          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.ref_name }}" = "main" ]; then
            production_readiness_args=(--commit ${{ github.sha }} "${production_readiness_args[@]}")
          else
            echo "Branch ${{ github.ref_name }} browser e2e targets live production without commit pinning."
          fi

          node scripts/wait-for-production-deploy.ts "${production_readiness_args[@]}"

      - name: run production browser e2e
        # Intentional: production coverage stays full-suite against the
        # deployed site. The package script lowers worker count for
        # determinism instead of narrowing this to smoke coverage.
        run: pnpm run test:e2e:production

      - name: upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-playwright-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  production-e2e:
    name: production e2e
    if: always()
    needs: [wait-for-production-deploy, production-e2e-browser]
    runs-on: ubuntu-latest

    steps:
      - name: assert production e2e jobs passed
        run: |
          if [ "${{ needs.wait-for-production-deploy.result }}" != "success" ]; then
            echo "wait-for-production-deploy result: ${{ needs.wait-for-production-deploy.result }}"
            exit 1
          fi

          if [ "${{ needs.production-e2e-browser.result }}" != "success" ]; then
            echo "production-e2e-browser result: ${{ needs.production-e2e-browser.result }}"
            exit 1
          fi
